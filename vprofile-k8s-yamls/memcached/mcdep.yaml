apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpromc
  labels:
    app: vpro-mc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpro-mc
  template:
    metadata:
      labels:
        app: vpro-mc
    spec:
      containers:
      - name: memcached
        image: memcached
        ports:
        - name: memcache-port
          containerPort: 11211
